services:
  postgres:
    image: postgres:16-alpine
    container_name: ea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ea_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-event_analytics}
    ports:
      # Host 15432: a native Postgres on this machine already squats 5432/5433.
      - "15432:5432"
    volumes:
      - ea_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ea} -d ${POSTGRES_DB:-event_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: ea-nats
    restart: unless-stopped
    # -js enables JetStream (persistent streams for ingestion).
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ea_pgdata:
